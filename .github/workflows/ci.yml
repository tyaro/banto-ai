name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (3.14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Compile Python sources
        run: python -m compileall -q src tests tools
      - name: Run unittest
        run: python -B -m unittest discover -s tests -t .
      - name: Validate manifests and naive smoke
        run: python tools/smoke.py
      - name: Generate and quality-check synthetic dataset from clean checkout entrypoints
        run: |
          python tools/data-generator/generate.py --config examples/configs/synthetic-motor-small.json --output artifacts/generated/synthetic-motor-small
          python tools/data-generator/check_quality.py --dataset artifacts/generated/synthetic-motor-small
      - name: Run benchmark from clean checkout entrypoint
        run: python tools/evaluator/run_benchmark.py --config examples/configs/benchmark-small.json
      - name: Repository safety guard
        if: always()
        run: python tools/safety_check.py

  rust:
    name: rust (1.95)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml and installs the pinned 1.95.0 toolchain.
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run tests
        run: cargo test --locked --workspace
      - name: Run R2P artificial training tests
        run: cargo test --locked -p banto-ai --features training-tests --test r2p_synthetic --test r2p_full_model
