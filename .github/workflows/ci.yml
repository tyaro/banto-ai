name: Phase 1 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q src tests tools
      - name: Run unittest
        run: python -m unittest discover -s tests -t . -v
      - name: Validate manifests and naive smoke
        run: python tools/smoke.py
      - name: Generate and quality-check synthetic dataset from clean checkout entrypoints
        run: |
          python tools/data-generator/generate.py --config examples/configs/synthetic-motor-small.json --output artifacts/generated/synthetic-motor-small
          python tools/data-generator/check_quality.py --dataset artifacts/generated/synthetic-motor-small
      - name: Run benchmark from clean checkout entrypoint
        run: python tools/evaluator/run_benchmark.py --config examples/configs/benchmark-small.json
      - name: Repository safety guard
        run: python tools/safety_check.py

  windows-native-fixture:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create canonical fixture temp
        shell: pwsh
        run: New-Item -ItemType Directory -Path C:\banto-v03-ci-temp -ErrorAction Stop | Out-Null
      - name: Windows native fixture compatibility
        env:
          PYTHONPATH: src;.
          TMPDIR: C:\banto-v03-ci-temp
          TEMP: C:\banto-v03-ci-temp
          TMP: C:\banto-v03-ci-temp
        run: python -m unittest tests.test_anomaly_v03_publication tests.test_anomaly_v03_native -v
