name: Phase 1 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (3.14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Compile Python sources
        run: python -m compileall -q src tests tools
      - name: Run unittest
        run: python -B tools/ci_test_report.py
      - name: Validate manifests and naive smoke
        run: python tools/smoke.py
      - name: Generate and quality-check synthetic dataset from clean checkout entrypoints
        run: |
          python tools/data-generator/generate.py --config examples/configs/synthetic-motor-small.json --output artifacts/generated/synthetic-motor-small
          python tools/data-generator/check_quality.py --dataset artifacts/generated/synthetic-motor-small
      - name: Run benchmark from clean checkout entrypoint
        run: python tools/evaluator/run_benchmark.py --config examples/configs/benchmark-small.json
      - name: Repository safety guard
        if: always()
        run: python tools/safety_check.py
      - name: Preserve unittest evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unittest-ubuntu24-python3.14-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-tests/unittest.jsonl
          if-no-files-found: error
          retention-days: 14

  verify-python314-journal:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: unittest-ubuntu24-python3.14-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-fixtures/python3.14
          digest-mismatch: error
      - name: Verify Python 3.14 regression journal and shared fixture inventory
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          workflow_sha256="$(git show HEAD:.github/workflows/ci.yml | sha256sum | awk '{print $1}')"
          python -B tools/ci_verify_python314_journal.py \
            --python314 artifacts/ci-fixtures/python3.14/unittest.jsonl \
            --expected-head "$EXPECTED_HEAD" \
            --expected-workflow-sha256 "$workflow_sha256" \
            --expected-run-id "$EXPECTED_RUN_ID" \
            --expected-run-attempt "$EXPECTED_RUN_ATTEMPT" \
            > artifacts/ci-fixtures/regression.pending.json
          mv artifacts/ci-fixtures/regression.pending.json artifacts/ci-fixtures/regression.json
      - name: Repository safety guard
        if: always()
        run: python tools/safety_check.py
      - name: Preserve Python 3.14 journal verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python314-journal-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-fixtures/regression.json
          if-no-files-found: error
          retention-days: 14
