name: Phase 1 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q src tests tools
      - name: Run unittest
        run: python -B tools/ci_test_report.py
      - name: Validate manifests and naive smoke
        run: python tools/smoke.py
      - name: Generate and quality-check synthetic dataset from clean checkout entrypoints
        run: |
          python tools/data-generator/generate.py --config examples/configs/synthetic-motor-small.json --output artifacts/generated/synthetic-motor-small
          python tools/data-generator/check_quality.py --dataset artifacts/generated/synthetic-motor-small
      - name: Run benchmark from clean checkout entrypoint
        run: python tools/evaluator/run_benchmark.py --config examples/configs/benchmark-small.json
      - name: Repository safety guard
        if: always()
        run: python tools/safety_check.py
      - name: Preserve unittest evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unittest-ubuntu24-python${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-tests/unittest.jsonl
          if-no-files-found: error
          retention-days: 14

  compare-shared-fixtures:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: unittest-ubuntu24-python3.12-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-fixtures/python3.12
          digest-mismatch: error
      - uses: actions/download-artifact@v8
        with:
          name: unittest-ubuntu24-python3.14-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-fixtures/python3.14
          digest-mismatch: error
      - name: Compare shared hand fixtures
        run: python -B tools/ci_compare_fixtures.py
      - name: Repository safety guard
        if: always()
        run: python tools/safety_check.py
      - name: Preserve shared fixture comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-fixtures/comparison.json
          if-no-files-found: error
          retention-days: 14
